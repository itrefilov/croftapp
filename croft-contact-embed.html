<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CROFT — контакты</title>
<style>
  @font-face{font-family:"Tilda Sans";font-weight:300;font-display:swap;
    src:url("assets/tilda-sans-300.woff2") format("woff2"),
         url("https://db.onlinewebfonts.com/t/78ef8357d99ff7635b5d6bcc5896ea5f.woff2") format("woff2")}
  @font-face{font-family:"Tilda Sans";font-weight:600;font-display:swap;
    src:url("assets/tilda-sans-600.woff2") format("woff2"),
         url("https://db.onlinewebfonts.com/t/207d85b8fdcba877dad19498bc1023a3.woff2") format("woff2")}

  :root{--bg:#0F1F35;--lite:#E9F0F8;--ink:#10314F;--acc:#4FC3F0;--dim:rgba(214,228,238,.42)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--bg);color:var(--lite);overflow-x:hidden;
    font-family:"Tilda Sans","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}

  .screen{position:relative;width:100%;height:100vh;min-height:100vh;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(ellipse 55% 9.2% at 20% 5.0%, rgba(74,124,190,.16), rgba(0,0,0,0) 68%),
      radial-gradient(ellipse 46% 7.9% at 96% 15.6%, rgba(60,110,175,.15), rgba(0,0,0,0) 68%),
      radial-gradient(ellipse 52% 8.5% at 8% 26.3%, rgba(74,124,190,.13), rgba(0,0,0,0) 68%),
      radial-gradient(ellipse 50% 8.5% at 92% 42.7%, rgba(60,110,175,.14), rgba(0,0,0,0) 68%),
      radial-gradient(ellipse 54% 9.2% at 14% 59.7%, rgba(74,124,190,.13), rgba(0,0,0,0) 68%),
      radial-gradient(ellipse 50% 8.5% at 90% 78.7%, rgba(60,110,175,.14), rgba(0,0,0,0) 68%),
      radial-gradient(ellipse 56% 9.2% at 50% 93.1%, rgba(74,124,190,.15), rgba(0,0,0,0) 68%),
      linear-gradient(180deg, #080D10 0%, #0C1727 3.9%, #0F1F35 8.5%, #0F1F35 100%);
    background-size:100% 495vh;background-repeat:no-repeat;background-position:0 -427vh}
  .stage{position:relative;flex:none;width:1920px;height:734px;padding:40px 96px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transform:scale(var(--s,1));transform-origin:center center}
  .net{position:absolute;left:0;top:-427vh;width:100%;height:495vh;opacity:.6;pointer-events:none}

  .h1{margin:0;font-weight:600;font-size:56px;line-height:1.14;letter-spacing:-.02em;text-align:center}

  /* ---------- визитка ---------- */
  .card{display:flex;align-items:center;gap:46px;margin-top:46px;
    background:#16273E;border:1px solid rgba(140,190,240,.16);border-radius:20px;
    padding:32px 46px;box-shadow:0 30px 70px rgba(4,14,28,.42)}
  .ava{width:132px;height:132px;flex:none;border-radius:50%;display:block;
    box-shadow:0 0 0 1px rgba(140,190,240,.28), 0 0 34px rgba(79,195,240,.18)}
  .who{min-width:286px}
  .name{font-weight:600;font-size:26px;line-height:1.2;letter-spacing:-.01em}
  .role{margin-top:9px;font-weight:300;font-size:16px;line-height:1.45;
    color:rgba(226,238,248,.62);max-width:27ch}
  .vr{width:1px;align-self:stretch;background:rgba(140,190,240,.18);flex:none}
  .links{display:flex;flex-direction:column;gap:15px}
  .lk{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
    border-radius:10px;padding:6px 10px;margin:-6px -10px;
    transition:background-color .22s ease}
  .lk:hover{background:rgba(140,190,240,.09)}
  .lk:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .lk i{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:9px;
    background:rgba(140,190,240,.1);color:var(--acc);
    transition:background-color .22s ease}
  .lk:hover i{background:rgba(79,195,240,.18)}
  .lk svg{width:17px;height:17px}
  .lk b{display:block;font-weight:300;font-size:11px;letter-spacing:.11em;
    text-transform:uppercase;color:var(--dim);margin-bottom:3px}
  .lk span{font-weight:300;font-size:17px;color:#E3EBF3;letter-spacing:.01em}

  .cta{display:inline-flex;align-items:center;gap:11px;margin-top:42px;border:0;border-radius:999px;
    padding:16px 32px;background:var(--lite);color:var(--ink);font-family:inherit;font-weight:600;
    font-size:17px;line-height:1;cursor:pointer;box-shadow:0 10px 30px rgba(4,14,28,.32);
    transition:background-color .25s ease,transform .25s cubic-bezier(.2,.7,.3,1),box-shadow .25s ease}
  .cta:hover{background:#FFFFFF;transform:translateY(-2px);
    box-shadow:0 16px 40px rgba(4,14,28,.42),0 0 0 1px rgba(79,195,240,.4)}
  .cta:active{transform:translateY(0)}
  .cta:focus-visible{outline:2px solid var(--acc);outline-offset:4px}
  .cta svg{width:19px;height:19px;flex:none;transition:transform .25s ease}
  .cta:hover svg{transform:translateX(3px)}

  @media (prefers-reduced-motion: reduce){
    .cta,.cta svg,.lk,.lk i{transition:none}
    .cta:hover,.cta:hover svg{transform:none}
  }


  /* ======================= МОБИЛЬНАЯ ВЁРСТКА =======================
     Композиция живёт на холсте шириной 390 и масштабируется через
     transform: scale(--s). Всё ниже написано в координатах этого холста:
     что видно на 390, то же самое на любом другом телефоне — только
     крупнее или мельче. Переносов строк, зависящих от ширины, нет,
     поэтому высота блока предсказуема и равна MLAY[MIDX] * s. */
  .mnet{display:none}
  @media (max-width:899px){
    .net{display:none}
    .mnet{position:absolute;left:0;width:100%;opacity:.6;pointer-events:none;display:block}
    .screen{display:block;height:auto;min-height:0;overflow:hidden;
      background:
            radial-gradient(ellipse 118% 2.84% at 24% 5.5%, rgba(74,124,190,.17), rgba(0,0,0,0) 70%),
            radial-gradient(ellipse 104% 2.616% at 88% 15.5%, rgba(60,110,175,.15), rgba(0,0,0,0) 70%),
            radial-gradient(ellipse 112% 2.766% at 10% 26.5%, rgba(74,124,190,.14), rgba(0,0,0,0) 70%),
            radial-gradient(ellipse 108% 2.691% at 86% 41.5%, rgba(60,110,175,.15), rgba(0,0,0,0) 70%),
            radial-gradient(ellipse 116% 2.766% at 18% 57.5%, rgba(74,124,190,.14), rgba(0,0,0,0) 70%),
            radial-gradient(ellipse 106% 2.691% at 82% 73.5%, rgba(60,110,175,.15), rgba(0,0,0,0) 70%),
            radial-gradient(ellipse 120% 2.915% at 50% 90.5%, rgba(74,124,190,.16), rgba(0,0,0,0) 70%),
            linear-gradient(180deg, #0F1F35 0%, #102542 46%, #0F1F35 100%);
      background-repeat:no-repeat;background-position:0 0}
    .stage{width:390px;height:auto;min-height:0;flex:none;
      margin-left:calc(50% - 195px);
      transform:scale(var(--s,1));transform-origin:top center;
      -webkit-tap-highlight-color:transparent}

    .stage{padding:52px 26px 58px;align-items:stretch}
    .h1{font-size:30px;line-height:1.2;text-wrap:balance}

    /* Визитка складывается: фото и имя в строку, дальше линия и контакты.
       Каждая ссылка — полоса в 52px, под палец. */
    .card{flex-wrap:wrap;align-items:center;gap:0;width:100%;margin-top:32px;
      padding:22px 20px 24px;border-radius:16px;
      box-shadow:0 20px 46px rgba(4,14,28,.42)}
    .ava{width:76px;height:76px}
    .who{min-width:0;flex:1;margin-left:18px}
    .name{font-size:21px}
    .role{margin-top:7px;font-size:14px;line-height:1.4;max-width:none}
    .vr{width:100%;height:1px;align-self:auto;margin:20px 0}
    .links{width:100%;gap:0}
    .lk{gap:13px;padding:13px 10px;margin:0 -10px;border-radius:10px}
    .lk:hover{background:transparent}
    .lk:active{background:rgba(140,190,240,.13)}
    .lk i{width:38px;height:38px;border-radius:10px}
    .lk:hover i{background:rgba(140,190,240,.1)}
    .lk svg{width:18px;height:18px}
    .lk b{font-size:10px;letter-spacing:.1em;margin-bottom:3px;color:rgba(214,228,238,.6)}
    .lk span{font-size:15.5px}

    .cta{margin-top:34px;font-size:16px;padding:16px 26px;width:100%;justify-content:center}
    .cta:hover{transform:none;background:var(--lite);box-shadow:0 10px 30px rgba(4,14,28,.32)}
    .cta:active{background:#FFFFFF;transform:translateY(1px)}
  }
</style>
</head>

<script>
(function(){
  /* ================= мобильный режим =================
     Композиция живёт на холсте шириной 390 и масштабируется через
     transform: scale(s), s = clamp(0.82, ширина окна / 390, 1.28).
     Высота блока на устройстве = MLAY[MIDX] * s — величина, которую
     каждый из шести файлов вычисляет сам, поэтому общее фоновое поле
     и сеть сходятся на стыках без обмена сообщениями между iframe. */
  var MOB=899, MW=390, MS_MIN=0.82, MS_MAX=1.28;
  var MLAY=[825,1543,1436,1011,1218,656], MIDX=5;
  function isMob(){ return window.innerWidth<=MOB; }
  function mscale(){ return Math.max(MS_MIN, Math.min(MS_MAX, window.innerWidth/MW)); }
  /* Расчётная высота блока — MLAY[MIDX] * s, и в обычной жизни содержимое
     занимает ровно её. Но если у посетителя включён увеличенный системный
     шрифт, текст может не поместиться. Тогда блок вырастает по факту,
     а не обрезает содержимое: небольшой сдвиг фонового поля переносится
     легче, чем срезанный абзац. Допуск в 4px — чтобы дробные округления
     не заставляли расти на пиксель на каждом устройстве. */
  function mBlockH(){
    var ms=mscale(), base=Math.round(MLAY[MIDX]*ms);
    var need = stageEl ? Math.ceil(stageEl.scrollHeight*ms) : 0;
    return need > base + 4 ? need : base;
  }

  var BASE_W=1920, BASE_H=734, MIN_S=0.4, MAX_S=1.5;
  var stageEl=document.querySelector('.stage');
  /* общее фоновое поле: считается в пикселях от реальной высоты окна */
  var LAYOUT=[100,100,88,77,87,75,68], IDX=6;
  function field(){
    var sc=document.querySelector('.screen'), nt=document.querySelector('.net'),
        mn=document.querySelector('.mnet'), i, total=0, before=0, f, o;
    if(isMob()){
      var ms=mscale();
      for(i=0;i<MLAY.length;i++){ total+=MLAY[i]; if(i<MIDX) before+=MLAY[i]; }
      f=Math.round(total*ms); o=Math.round(before*ms);
      sc.style.backgroundSize='100% '+f+'px';
      sc.style.backgroundPosition='0 -'+o+'px';
      if(mn){
        /* Сеть — часть композиции, поэтому масштабируется тем же
           коэффициентом и центрируется вместе с холстом. Иначе там,
           где s упирается в ограничитель (очень узкий экран или
           альбомная ориентация), горизонтальный масштаб расходится
           с вертикальным и узлы вытягиваются в овалы. */
        var nw=Math.round(MW*ms);
        mn.style.height=f+'px'; mn.style.top=(-o)+'px';
        mn.style.width=nw+'px'; mn.style.left='50%'; mn.style.marginLeft=(-Math.round(nw/2))+'px';
      }
      return;
    }
    var pageVH=window.innerHeight/(LAYOUT[IDX]/100);
    for(i=1;i<LAYOUT.length;i++){ total+=LAYOUT[i]; if(i<IDX) before+=LAYOUT[i]; }
    f=Math.round(total/100*pageVH); o=Math.round(before/100*pageVH);
    sc.style.backgroundSize='100% '+f+'px';
    sc.style.backgroundPosition='0 -'+o+'px';
    nt.style.height=f+'px'; nt.style.top=(-o)+'px';
  }
  function fit(){
    if(isMob()){
      var ms=mscale();
      stageEl.style.setProperty('--s', ms.toFixed(4));
      document.querySelector('.screen').style.height=mBlockH()+'px';
      return;
    }
    document.querySelector('.screen').style.removeProperty('height');
    var s=Math.min(window.innerWidth/BASE_W, window.innerHeight/BASE_H);
    stageEl.style.setProperty('--s', Math.max(MIN_S,Math.min(MAX_S,s)).toFixed(4));
  }
  function postHeight(){
    if(window.parent===window) return;
    var h = isMob() ? mBlockH() : Math.round(window.innerHeight);
    window.parent.postMessage({type:'croft:height', height:h, mobile:isMob()}, '*');
  }

  /* В заголовке перенос стоит внутри строки без пробела:
     «…с CROFT<br>уже сегодня». На узком экране авторский перенос не нужен,
     но убрать его через display:none нельзя — слова слипнутся. */
  if(isMob()){
    var hEl=document.querySelector('.h1'), brEl=hEl && hEl.querySelector('br');
    if(brEl) brEl.parentNode.replaceChild(document.createTextNode(' '), brEl);
  }

  var ctaBtn=document.getElementById('cta');
  if(ctaBtn) ctaBtn.addEventListener('click', function(){
    if(window.parent===window) return;
    try{ window.parent.postMessage({type:'croft:cta', form:'demo', screen:'contact'}, '*'); }catch(err){}
  });

  field(); fit(); postHeight();
  window.addEventListener('resize', function(){ field(); fit(); postHeight(); });
  if (document.fonts && document.fonts.ready)
    document.fonts.ready.then(function(){ fit(); postHeight(); });
  window.addEventListener('load', function(){ fit(); postHeight(); });
})();
</script>

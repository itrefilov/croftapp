<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CROFT — показатели платформы</title>
<style>
  @font-face { font-family: "Tilda Sans"; font-weight: 300; font-display: swap;
    src: url("assets/tilda-sans-300.woff2") format("woff2"),
         url("https://db.onlinewebfonts.com/t/78ef8357d99ff7635b5d6bcc5896ea5f.woff2") format("woff2"); }
  @font-face { font-family: "Tilda Sans"; font-weight: 600; font-display: swap;
    src: url("assets/tilda-sans-600.woff2") format("woff2"),
         url("https://db.onlinewebfonts.com/t/207d85b8fdcba877dad19498bc1023a3.woff2") format("woff2"); }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #0F1F35; color: #E9F0F8; overflow-x: hidden;
    font-family: "Tilda Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  a { color: #4FC3F0; text-decoration: none; }
  a:hover { color: #8ad9f4; }
  @keyframes fanSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .screen {
    position: relative; width: 100%; height: 100vh; min-height: 100vh;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse 55% 9.2% at 20% 5.0%, rgba(74,124,190,.16), rgba(0,0,0,0) 68%),
      radial-gradient(ellipse 46% 7.9% at 96% 15.6%, rgba(60,110,175,.15), rgba(0,0,0,0) 68%),
      radial-gradient(ellipse 52% 8.5% at 8% 26.3%, rgba(74,124,190,.13), rgba(0,0,0,0) 68%),
      radial-gradient(ellipse 50% 8.5% at 92% 42.7%, rgba(60,110,175,.14), rgba(0,0,0,0) 68%),
      radial-gradient(ellipse 54% 9.2% at 14% 59.7%, rgba(74,124,190,.13), rgba(0,0,0,0) 68%),
      radial-gradient(ellipse 50% 8.5% at 90% 78.7%, rgba(60,110,175,.14), rgba(0,0,0,0) 68%),
      radial-gradient(ellipse 56% 9.2% at 50% 93.1%, rgba(74,124,190,.15), rgba(0,0,0,0) 68%),
      linear-gradient(180deg, #080D10 0%, #0C1727 3.9%, #0F1F35 8.5%, #0F1F35 100%);
    background-size:100% 495vh;background-repeat:no-repeat;
    background-position: 0 0;
  }
  .stage {
    position: relative; flex: none; width:1920px;height:1080px;
    padding: 169px 96px 20px; display: flex; flex-direction: column;
    justify-content: center; gap: 34px;
    transform: scale(var(--s, 1)); transform-origin: center center;
  }
  .net{position:absolute;left:0;width:100%;height:495vh;opacity:.6;pointer-events:none}
  /* стык с первым экраном: фон приходит из его почти-чёрного и светлеет */
  .tophaze{position:absolute;left:0;right:0;top:0;height:15vh;z-index:2;pointer-events:none;
    background:linear-gradient(180deg,#080D10 0%,rgba(8,13,16,.72) 34%,rgba(8,13,16,0) 100%)}

  .head { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 26px; }
  .h1 { font-weight: 600; font-size: 72px; line-height: 1.06; letter-spacing: -0.02em; color: #E9F0F8; max-width: 620px; text-wrap: pretty; margin: 0; }
  .pill {
    display: inline-flex; align-items: center; border: 1px solid rgba(232,240,247,0.5);
    border-radius: 999px; padding: 15px 34px; font-weight: 300; font-size: 20px; color: #E3EBF3;
    cursor: default; transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
  }
  .pill:hover { background-color: #E9F0F8; color: #10314F; border-color: #E9F0F8; }

  .strip { position: relative; display: grid; grid-template-columns: repeat(auto-fit, minmax(272px, 1fr)); gap: 34px 0; }
  .cell { display: flex; min-width: 0; flex-direction: column; gap: 16px; padding-right: 24px; }
  .cell + .cell { padding-left: 32px; border-left: 1px solid rgba(255,255,255,0.11); }
  .cell:last-child { padding-right: 0; }
  .row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .fig { font-weight: 600; font-size: 62px; line-height: 0.88; letter-spacing: -0.025em; color: #EAF1F8; white-space: nowrap; }
  .unit { font-weight: 300; font-size: 24px; color: #4FC3F0; }
  .pre { font-weight: 300; font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(220,233,242,0.45); }
  .cap { font-weight: 300; font-size: 14px; line-height: 1.45; letter-spacing: 0.09em; text-transform: uppercase; color: rgba(220,233,242,0.55); max-width: 180px; }

  .demo { position: relative; display: flex; flex-direction: column; gap: 20px; }
  .hint { font-weight: 300; font-size: 15px; color: rgba(220,233,242,0.5); }

  .box {
    position: relative; background: #2E3439; border: 1px solid #1B1F22; border-radius: 10px;
    box-shadow: 0 26px 60px rgba(0,0,0,0.4); overflow: hidden;
  }
  .roof {
    height: 17px; background-color: #2E3439; border-bottom: 1px solid #1B1F22;
    background-image: repeating-linear-gradient(90deg, rgba(0,0,0,0.32) 0 2px, rgba(255,255,255,0.05) 2px 4px, rgba(0,0,0,0) 4px 10px);
  }
  .bay {
    position: relative; background: #171B1F; box-shadow: inset 0 10px 22px rgba(0,0,0,0.5);
    padding: 11px 12px; display: flex; align-items: stretch; gap: 10px;
  }
  .cap-wall {
    width: 13px; flex: none; align-self: stretch; border-radius: 2px;
    background-image: repeating-linear-gradient(0deg, #B4BCC1 0 2px, #8A949B 2px 4px);
    box-shadow: inset 0 0 0 1px rgba(20,24,28,0.35);
  }
  .rows { flex: 1 1 0; min-width: 0; display: flex; align-items: stretch; gap: 10px; }
  .floor { height: 15px; background-image: linear-gradient(180deg, #3C4349, #262B30); border-top: 1px solid #14181B; }
  .cast { position: absolute; width: 17px; height: 13px; border-radius: 2px; background: #14181B; }

  .sec {
    flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 7px;
    padding: 8px 8px 9px; border-radius: 6px; cursor: pointer;
    background: rgba(180,188,193,0.03); border: 1px solid rgba(180,188,193,0.13);
    transition: background-color 0.3s ease, border-color 0.3s ease;
  }
  .sec:hover { border-color: rgba(232,98,42,0.5); background-color: rgba(232,98,42,0.05); }
  .light { height: 3px; border-radius: 2px; background-color: #E6EEF1; box-shadow: 0 0 12px rgba(226,238,241,0.6); transition: background-color 0.35s ease, box-shadow 0.35s ease; }
  .shead { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: nowrap; }
  .slabel { font-weight: 300; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(214,228,238,0.42); white-space: nowrap; }
  .sstate { display: flex; align-items: center; gap: 5px; flex: none; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background-color: #6CBE45; box-shadow: 0 0 6px rgba(108,190,69,0.9); transition: background-color 0.3s ease, box-shadow 0.3s ease; }
  .stxt { font-weight: 300; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(214,228,238,0.45); white-space: nowrap; transition: color 0.3s ease; }
  .cable {
    height: 6px; border-radius: 1px; opacity: 0.75; transition: opacity 0.35s ease;
    background-image: repeating-linear-gradient(90deg, #3E6EA8 0 1.5px, rgba(0,0,0,0) 1.5px 4px, #737F88 4px 5.5px, rgba(0,0,0,0) 5.5px 9px);
  }
  .shelf { display: flex; flex-direction: column; gap: 3px; }
  .units { display: flex; gap: 4px; }
  .plate { height: 2px; border-radius: 1px; background: linear-gradient(90deg, #8D979E, #6E7880); }
  .bus { height: 3px; border-radius: 2px; background: rgba(108,190,69,0.45); transition: background 0.3s ease; }

  .asic {
    flex: 1 1 0; min-width: 0; height: 29px; border-radius: 3px; border: 1px solid #444D54;
    position: relative; display: flex; align-items: center; justify-content: center;
    background-image: linear-gradient(180deg, #7C878F, #5C666D);
    transition: background-image 0.3s ease, opacity 0.3s ease;
  }
  .fan {
    width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(16,20,24,0.5);
    animation: fanSpin 1.4s linear infinite; transition: opacity 0.3s ease;
    background-image:
      radial-gradient(circle 3px at 50% 50%, rgba(16,20,24,0.75) 0 3px, rgba(0,0,0,0) 3px),
      conic-gradient(from 0deg, rgba(16,20,24,0.5) 0deg 18deg, rgba(0,0,0,0) 18deg 90deg, rgba(16,20,24,0.5) 90deg 108deg, rgba(0,0,0,0) 108deg 180deg, rgba(16,20,24,0.5) 180deg 198deg, rgba(0,0,0,0) 198deg 270deg, rgba(16,20,24,0.5) 270deg 288deg, rgba(0,0,0,0) 288deg 360deg);
  }
  .led { position: absolute; right: 3px; bottom: 3px; width: 3px; height: 3px; border-radius: 50%; background-color: #6CBE45; box-shadow: 0 0 4px rgba(108,190,69,0.95); transition: background-color 0.3s ease, box-shadow 0.3s ease; }

  .sec.off .light { background-color: #39424A; box-shadow: none; }
  .sec.off .cable { opacity: 0.3; }
  .sec.off .bus { background: rgba(120,130,140,0.2); }
  .sec.off .dot { background-color: #E8622A; box-shadow: 0 0 6px rgba(232,98,42,0.85); }
  .sec.off .stxt { color: rgba(240,138,90,0.95); }
  .asic.off { background-image: linear-gradient(180deg, #464F56, #363E44); opacity: 0.62; }
  .asic.off .fan { animation-play-state: paused; opacity: 0.4; }
  .asic.off .led { background-color: #4A5359; box-shadow: none; }

  @media (prefers-reduced-motion: reduce) {
    .fan { animation: none; }
  }

  /* ======================= МОБИЛЬНАЯ ВЁРСТКА =======================
     Композиция живёт на холсте шириной 390 и масштабируется через
     transform: scale(--s). Всё ниже написано в координатах этого холста:
     что видно на 390, то же самое на любом другом телефоне — только
     крупнее или мельче. Переносов строк, зависящих от ширины, нет,
     поэтому высота блока предсказуема и равна MLAY[MIDX] * s. */
  .mnet{display:none}
  @media (max-width:899px){
    .net{display:none}
    .mnet{position:absolute;left:0;width:100%;opacity:.6;pointer-events:none;display:block}
    .screen{display:block;height:auto;min-height:0;overflow:hidden;
      background:
            radial-gradient(ellipse 118% 2.84% at 24% 5.5%, rgba(74,124,190,.17), rgba(0,0,0,0) 70%),
            radial-gradient(ellipse 104% 2.616% at 88% 15.5%, rgba(60,110,175,.15), rgba(0,0,0,0) 70%),
            radial-gradient(ellipse 112% 2.766% at 10% 26.5%, rgba(74,124,190,.14), rgba(0,0,0,0) 70%),
            radial-gradient(ellipse 108% 2.691% at 86% 41.5%, rgba(60,110,175,.15), rgba(0,0,0,0) 70%),
            radial-gradient(ellipse 116% 2.766% at 18% 57.5%, rgba(74,124,190,.14), rgba(0,0,0,0) 70%),
            radial-gradient(ellipse 106% 2.691% at 82% 73.5%, rgba(60,110,175,.15), rgba(0,0,0,0) 70%),
            radial-gradient(ellipse 120% 2.915% at 50% 90.5%, rgba(74,124,190,.16), rgba(0,0,0,0) 70%),
            linear-gradient(180deg, #0F1F35 0%, #102542 46%, #0F1F35 100%);
      background-repeat:no-repeat;background-position:0 0}
    .stage{width:390px;height:auto;min-height:0;flex:none;
      margin-left:calc(50% - 195px);
      transform:scale(var(--s,1));transform-origin:top center;
      -webkit-tap-highlight-color:transparent}

    /* ---- заголовок ---- */
    .stage{padding:46px 26px 68px;gap:0;display:block}
    .tophaze{display:none}
    .head{display:block}
    .h1{font-size:38px;line-height:1.08;max-width:none;margin:0 0 22px}
    .pill{font-size:15px;padding:12px 26px;letter-spacing:.005em}

    /* ---- четыре цифры: сетка 2x2 с внутренним крестом ---- */
    .strip{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:38px}
    .cell,.cell+.cell{padding:20px 12px 20px 18px;gap:11px;border-left:0}
    .cell:nth-child(odd){padding-left:0;padding-right:16px}
    /* Строка «более 100 МВт» на 159px помещается впритык. Пока счётчик
       крутится, число короче и строка не переносится, а на финальном
       значении переносилась — блок дёргался на 24px и фон уезжал.
       Запрещаем перенос и подрезаем кегли так, чтобы он и не понадобился. */
    .row{flex-wrap:nowrap;gap:4px 7px}
    .cell:nth-child(even){border-left:1px solid rgba(255,255,255,.12)}
    .cell:nth-child(-n+2){padding-top:0}
    .cell:nth-child(n+3){border-top:1px solid rgba(255,255,255,.12);padding-bottom:0}
    .fig{font-size:44px;line-height:.86}
    .unit{font-size:16px}
    .pre{font-size:11px;letter-spacing:.045em}
    .cap{font-size:11.5px;line-height:1.42;letter-spacing:.085em;max-width:none}

    /* ---- контейнер в разрезе ----
       На 390px четыре секции по шесть асиков дают юнит в 12px: вентилятор
       перестаёт читаться, а он и есть то живое пятно, ради которого сцена
       нарисована. Поэтому на телефоне показаны две секции по пять юнитов
       в полный размер — силуэт контейнера и механика отключения на месте,
       мельчить не пришлось. */
    .demo{margin-top:44px;gap:15px}
    .hint{font-size:13.5px;line-height:1.45;color:rgba(220,233,242,.58)}
    /* Тень уложена внутрь блока: с прежними 0 18px 40px она доставала
       до самого низа и притемняла последние пиксели — на стыке с третьим
       экраном это читалось ступенькой яркости. */
    .box{border-radius:9px;box-shadow:0 12px 28px rgba(0,0,0,.42)}
    .roof{height:13px}
    .bay{padding:10px 11px;gap:9px}
    .cap-wall{width:11px}
    .rows{gap:9px}
    .floor{height:12px}
    .cast{width:13px;height:10px}
    .sec{padding:9px 8px 10px;gap:7px;border-radius:5px}
    .light{height:3px}
    .shead{gap:6px}
    /* Подписи внутри контейнера подняты по контрасту до AA: на десктопе
       они читаются в масштабе, на телефоне идут в натуральную величину. */
    .slabel{font-size:9.5px;letter-spacing:.06em;color:rgba(214,228,238,.58)}
    .stxt{font-size:9.5px;letter-spacing:.04em;color:rgba(214,228,238,.6)}
    .dot{width:6px;height:6px}
    .cable{height:6px}
    .shelf{gap:3px}
    .units{gap:4px}
    .asic{height:25px;border-radius:3px}
    .fan{width:15px;height:15px}
    .led{width:4px;height:4px;right:3px;bottom:3px}
    .bus{height:3px}
    .sec:active{background-color:rgba(232,98,42,.07)}
  }
</style>
</head>

  <div class="stage">
  <div class="head">
    <h1 class="h1">Инфраструктура под управлением</h1>
    <div class="pill">Показатели платформы</div>
  </div>

  <div class="strip">
    <div class="cell">
      <div class="row"><div class="fig" data-num>45 000</div></div>
      <div class="cap">устройств под управлением</div>
    </div>
    <div class="cell">
      <div class="row"><div class="fig" data-num>12</div></div>
      <div class="cap">площадок подключено</div>
    </div>
    <div class="cell">
      <div class="row"><div class="pre">более</div><div class="fig" data-num>100</div><div class="unit">МВт</div></div>
      <div class="cap">отключается ежедневно</div>
    </div>
    <div class="cell">
      <div class="row"><div class="fig" data-num>2</div><div class="unit">мин</div></div>
      <div class="cap">на отключение любого объёма</div>
    </div>
  </div>

  <div class="demo">
    <div class="hint">Наведите курсор на любую секцию — оборудование в ней остановится</div>
    <div class="box">
      <div class="roof"></div>
      <div class="bay">
        <div class="cap-wall"></div>
        <div class="rows" id="rows"></div>
        <div class="cap-wall"></div>
      </div>
      <div class="floor"></div>
      <div class="cast" style="left: 6px; top: 5px;"></div>
      <div class="cast" style="right: 6px; top: 5px;"></div>
      <div class="cast" style="left: 6px; bottom: 5px;"></div>
      <div class="cast" style="right: 6px; bottom: 5px;"></div>
    </div>
  </div>
  </div>
</div>

<script>
(function () {
  /* ================= мобильный режим =================
     Композиция живёт на холсте шириной 390 и масштабируется через
     transform: scale(s), s = clamp(0.82, ширина окна / 390, 1.28).
     Высота блока на устройстве = MLAY[MIDX] * s — величина, которую
     каждый из шести файлов вычисляет сам, поэтому общее фоновое поле
     и сеть сходятся на стыках без обмена сообщениями между iframe. */
  var MOB=899, MW=390, MS_MIN=0.82, MS_MAX=1.28;
  var MLAY=[825,1543,1436,1011,1218,656], MIDX=0;
  function isMob(){ return window.innerWidth<=MOB; }
  function mscale(){ return Math.max(MS_MIN, Math.min(MS_MAX, window.innerWidth/MW)); }
  /* Расчётная высота блока — MLAY[MIDX] * s, и в обычной жизни содержимое
     занимает ровно её. Но если у посетителя включён увеличенный системный
     шрифт, текст может не поместиться. Тогда блок вырастает по факту,
     а не обрезает содержимое: небольшой сдвиг фонового поля переносится
     легче, чем срезанный абзац. Допуск в 4px — чтобы дробные округления
     не заставляли расти на пиксель на каждом устройстве. */
  function mBlockH(){
    var ms=mscale(), base=Math.round(MLAY[MIDX]*ms);
    var need = stageEl ? Math.ceil(stageEl.scrollHeight*ms) : 0;
    return need > base + 4 ? need : base;
  }

  /* На телефоне контейнер показывается двумя секциями по пять юнитов:
     четыре по шесть дали бы асик в 12px. Раскладка выбирается один раз,
     на старте — переключение ориентации композицию не пересобирает. */
  var SECTIONS = 4, SHELVES = 3, UNITS = 6;
  if (window.innerWidth <= 899) { SECTIONS = 2; UNITS = 5; }

  var rows = document.getElementById('rows');
  for (var s = 1; s <= SECTIONS; s++) {
    var sec = document.createElement('div');
    sec.className = 'sec';
    var html = '<div class="light"></div>'
      + '<div class="shead"><div class="slabel">Секция ' + s + '</div>'
      + '<div class="sstate"><div class="dot"></div><div class="stxt">в работе</div></div></div>'
      + '<div class="cable"></div>';
    for (var sh = 0; sh < SHELVES; sh++) {
      html += '<div class="shelf"><div class="units">';
      for (var u = 0; u < UNITS; u++) {
        html += '<div class="asic"><div class="fan"></div><div class="led"></div></div>';
      }
      html += '</div><div class="plate"></div></div>';
    }
    html += '<div class="bus"></div>';
    sec.innerHTML = html;
    rows.appendChild(sec);
  }

  var timers = new Map();
  function setSection(sec, off) {
    (timers.get(sec) || []).forEach(clearTimeout);
    var pending = [];
    timers.set(sec, pending);
    sec.classList.toggle('off', off);
    var txt = sec.querySelector('.stxt');
    if (txt) txt.textContent = off ? 'стоп' : 'в работе';
    var units = [].slice.call(sec.querySelectorAll('.asic'));
    units.forEach(function (a, i) {
      var delay = off ? i * 22 : (units.length - 1 - i) * 15;
      pending.push(setTimeout(function () { a.classList.toggle('off', off); }, delay));
    });
  }

  /* Наведение — на десктопе, нажатие-переключатель — на телефоне.
     Прежние touchstart/touchend работали как «нажать и держать»: секция
     гасла на каждом касании при начале прокрутки и возвращалась, стоило
     убрать палец, — результат никто не успевал увидеть. Клик оставляет
     секцию выключенной, пока по ней не нажмут ещё раз. */
  [].forEach.call(document.querySelectorAll('.sec'), function (sec) {
    sec.addEventListener('mouseenter', function () { if (!isMob()) setSection(sec, true); });
    sec.addEventListener('mouseleave', function () { if (!isMob()) setSection(sec, false); });
    sec.addEventListener('click', function () {
      if (!isMob()) return;
      setSection(sec, !sec.classList.contains('off'));
    });
  });
  if (isMob()) {
    var hintEl = document.querySelector('.hint');
    if (hintEl) hintEl.textContent = 'Коснитесь любой секции — оборудование в ней остановится';
  }

  var figs = [].slice.call(document.querySelectorAll('[data-num]')).map(function (el) {
    return { el: el, target: parseInt(el.textContent.replace(/[^0-9]/g, ''), 10) };
  });
  function fmt(n, target) {
    return target >= 10000 ? n.toLocaleString('ru-RU').replace(/\u00A0/g, ' ') : String(n);
  }
  var counted = false;
  function countUp() {
    if (counted) return;
    counted = true;
    figs.forEach(function (f, i) {
      if (!isFinite(f.target)) return;
      var t0 = performance.now() + 150 * i, dur = 1500;
      f.el.textContent = fmt(0, f.target);
      (function step(now) {
        var p = Math.max(0, Math.min(1, (now - t0) / dur));
        f.el.textContent = fmt(Math.round(f.target * (1 - Math.pow(1 - p, 3))), f.target);
        if (p < 1) requestAnimationFrame(step);
      })(performance.now());
    });
  }

  // Parent page can trigger the count-up precisely:
  //   iframe.contentWindow.postMessage({ type: 'croft:start' }, '*');
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'croft:start') { counted = false; countUp(); }
  });

  // Reports its natural height so the parent can size the iframe if it wants:
  //   window.addEventListener('message', e => { if (e.data.type === 'croft:height') iframe.style.height = e.data.height + 'px'; });
  function postHeight(){
    if(window.parent===window) return;
    var h = isMob() ? mBlockH() : Math.round(window.innerHeight);
    window.parent.postMessage({type:'croft:height', height:h, mobile:isMob()}, '*');
  }

  // Proportional fit: the composition is drawn on a fixed 1920x1080 artboard and
  // scaled by the smaller of the two viewport ratios, so it keeps its proportions
  // on any screen. Below 900px the artboard is dropped for the fluid mobile flow.
  var BASE_W=1920, BASE_H=1080, MIN_S = 0.4, MAX_S = 1.5;
  var stageEl = document.querySelector('.stage');
  /* общее фоновое поле: считается в пикселях от реальной высоты окна */
  var LAYOUT=[100,100,88,77,87,75,68], IDX=1;
  function field(){
    var sc=document.querySelector('.screen'), nt=document.querySelector('.net'),
        mn=document.querySelector('.mnet'), i, total=0, before=0, f, o;
    if(isMob()){
      var ms=mscale();
      for(i=0;i<MLAY.length;i++){ total+=MLAY[i]; if(i<MIDX) before+=MLAY[i]; }
      f=Math.round(total*ms); o=Math.round(before*ms);
      sc.style.backgroundSize='100% '+f+'px';
      sc.style.backgroundPosition='0 -'+o+'px';
      if(mn){
        /* Сеть — часть композиции, поэтому масштабируется тем же
           коэффициентом и центрируется вместе с холстом. Иначе там,
           где s упирается в ограничитель (очень узкий экран или
           альбомная ориентация), горизонтальный масштаб расходится
           с вертикальным и узлы вытягиваются в овалы. */
        var nw=Math.round(MW*ms);
        mn.style.height=f+'px'; mn.style.top=(-o)+'px';
        mn.style.width=nw+'px'; mn.style.left='50%'; mn.style.marginLeft=(-Math.round(nw/2))+'px';
      }
      return;
    }
    var pageVH=window.innerHeight/(LAYOUT[IDX]/100);
    for(i=1;i<LAYOUT.length;i++){ total+=LAYOUT[i]; if(i<IDX) before+=LAYOUT[i]; }
    f=Math.round(total/100*pageVH); o=Math.round(before/100*pageVH);
    sc.style.backgroundSize='100% '+f+'px';
    sc.style.backgroundPosition='0 -'+o+'px';
    nt.style.height=f+'px'; nt.style.top=(-o)+'px';
  }

  function fit(){
    if(isMob()){
      var ms=mscale();
      stageEl.style.setProperty('--s', ms.toFixed(4));
      document.querySelector('.screen').style.height=mBlockH()+'px';
      return;
    }
    document.querySelector('.screen').style.removeProperty('height');
    var s=Math.min(window.innerWidth/BASE_W, window.innerHeight/BASE_H);
    stageEl.style.setProperty('--s', Math.max(MIN_S,Math.min(MAX_S,s)).toFixed(4));
  }

  field(); fit();
  window.addEventListener('load', function () { fit(); countUp(); postHeight(); });
  window.addEventListener('resize', function(){ field(); fit(); postHeight(); });
  if (document.fonts && document.fonts.ready)
    document.fonts.ready.then(function(){ fit(); postHeight(); });
  if (document.readyState === 'complete') { fit(); countUp(); postHeight(); }
})();
</script>
